version: "3.8"

services:
  app:
    build: .
    ports:
      - "8090:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@db:5434/library_db
    depends_on:
      - db
    volumes:
      - ./src:/app/src

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: library_db
    ports:
      - "5433:5434"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
